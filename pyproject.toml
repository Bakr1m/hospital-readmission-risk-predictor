[project]
name = "hospital-readmission-risk-predictor"
version = "1.0.0"
description = "30-day hospital readmission risk predictor: LightGBM + SHAP, FastAPI, Docker"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
